# Pre-registered before any real Showhand take or outside human grade exists.
schema_version: 1
status: waiting_for_real_takes_and_human_grades
primary:
  outcome: cohen_kappa_with_outside_human_binary_grade
  treatment: fused_judge
  baseline: tracking_error_alone
  effect: paired_cohen_kappa_difference
  interval: paired_bootstrap_percentile_95
  bootstrap_replicates: 10000
  bootstrap_seed: 20261005
secondary:
  report_each_judge_agreement_rate: true
  report_confusion_matrices: true
  report_n: true
observed_undefined_kappa: evaluation_invalid
bootstrap_undefined_kappa: discard_replicate
minimum_valid_bootstrap_fraction: 0.95
resampling_unit: whole_take
missing_labels: reject
synthetic_data_policy: unit_tests_only_never_report_as_results
amendments:
  - date: 2026-10-06
    before_any_outside_human_grade: true
    reason: >-
      On the first three real takes the grounding guard refused 2 of 3 Nemotron answers
      (accept against failing evidence), which left the fused judge without a decision.
    fused_judge_procedure:
      - one Nemotron answer, guarded
      - if refused, one retry that is told the refusal reason, guarded
      - if refused again, a deterministic re-show of every negative cited window
      - fused_accept is the final decision of that procedure
    unchanged: [outcome, baseline, effect, interval, bootstrap, frozen_thresholds]
