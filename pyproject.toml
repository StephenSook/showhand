[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showhand"
version = "0.1.0"
description = "Offline grading and re-show guidance for NVIDIA GEAR-SONIC demonstration takes"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
showhand = "showhand.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/showhand"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

